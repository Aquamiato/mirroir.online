<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirroir — AI Personal Stylist & Virtual Try-On</title>
<meta name="description" content="Upload your photo and instantly get AI-powered outfit recommendations, shop the pieces, and try them on virtually. Free to start.">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f5f0eb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    background: #0d0b0a url('/hero-bg.webp') center center / cover no-repeat;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,11,10,0.55) 0%, rgba(13,11,10,0.85) 100%);
  }
  .hero {
    position: relative;
    z-index: 1;
    max-width: 720px;
    text-align: center;
    padding: 60px 20px;
  }
  .eyebrow {
    color: #C9A14A;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    line-height: 1.15;
    margin-bottom: 20px;
    font-weight: 700;
  }
  .sub {
    font-size: 1.1rem;
    color: rgba(245,240,235,0.85);
    line-height: 1.6;
    margin-bottom: 36px;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    background: #C9A14A;
    color: #0d0b0a;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 16px 40px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: scale(1.03); }
  .btn.secondary {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(245,240,235,0.4);
    color: #f5f0eb;
    backdrop-filter: blur(4px);
  }
  .logo {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 40px;
    color: #C9A14A;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">Mirroir</div>
    <p class="eyebrow">AI Personal Stylist</p>
    <h1>Your Best Look, in Minutes</h1>
    <p class="sub">Upload one photo. Get personalized outfits, shop instantly &amp; try them on with AI. The outfit generator that actually knows your body.</p>
    <div class="btn-row">
      <a class="btn" href="https://mirroir.style/analyze">Start Analyzing →</a>
      <a class="btn secondary" href="https://mirroir.style">📲 Get the App</a>
    </div>
  </div>
</body>
</html>
